default: # 6 month trial - The Gambia - default incidence
  n_boot: 1000
  n_sample_size: 
    - 2500
    - 5000
    - 10000
    - 20000
    - 40000
    - 80000
  dose_schedule: "6mo"
  site: "The Gambia"
  incidence_shigella_0_6: 0.0207 # the gambia incidence point estimates from EFGH
  incidence_severe_shigella_0_6: 0.0063
  incidence_shigella_6_12: 0.0656
  incidence_severe_shigella_6_12: 0.0213
  effect_shigella_growth_formula: "y ~ -1 + x + I(pmax(0, x - 4)) + I(pmax(0, x - 8))"
  scale_growth_effect_0_6: -0.25 # youngest kids 6-18 mo have larger effect (scale towards lower CI)
  scale_growth_effect_6_12: 0 # kids 18-24 mo have estimated effect
  VE_mild: 0.40
  VE_severe: 0.60
  estimand: ["nat_inf", "pop"]
  estimators: ["aipw"]
  exclusion_restriction: [TRUE]
  cross_world: [TRUE]
  two_stage: [FALSE]
  nat_inf_unadj: FALSE
  intervals:
    - 3
    - 6
    - 9
    - 12
    - [6, 12]
    - [3, 6, 9, 12]
  null_hypothesis_value: 0
  alpha_level: 0.05
  dropout: 0.10
  
